services:
  soulmask:
    container_name: ${SOULMASK_CONTAINER_NAME:-soulmask}
    image: ${SOULMASK_IMAGE:-acekorneya/soul_server}:${SOULMASK_TAG:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: ${SOULMASK_RESTART_POLICY:-unless-stopped}
    env_file:
      - ./.env
    environment:
      HOME: /home/pokuser/soulmask/instances/server_1/home
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SOULMASK_CONFIG_DIR: /home/pokuser/soulmask/config/server_1
      SOULMASK_CONFIG_ROOT_DIR: /home/pokuser/soulmask/config
      SOULMASK_DATA_DIR: /home/pokuser/soulmask/instances/server_1
      SOULMASK_INSTALL_DIR: /home/pokuser/soulmask/shared/server
      SOULMASK_SHARED_DIR: /home/pokuser/soulmask/shared
      SOULMASK_STEAMCMD_DIR: /home/pokuser/soulmask/shared/steamcmd
      SOULMASK_SERVER_ID: "1"
      SOULMASK_CLUSTER_MAIN_SERVER_PORT: "29000"
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "/usr/local/bin/soulmask-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    expose:
      - "29000"
    ports:
      - "${SOULMASK_PUBLISHED_GAME_PORT:-8777}:${SOULMASK_GAME_PORT:-8777}/udp"
      - "${SOULMASK_PUBLISHED_QUERY_PORT:-27015}:${SOULMASK_QUERY_PORT:-27015}/udp"
      - "${SOULMASK_PUBLISHED_RCON_PORT:-19000}:${SOULMASK_RCON_PORT:-19000}/tcp"
    networks:
      soulmask_cluster:
        aliases:
          - soulmask-main
    stop_grace_period: 120s
    volumes:
      - type: bind
        source: ${HOST_SHARED_DIR:-./shared}
        target: /home/pokuser/soulmask/shared
      - type: bind
        source: ${HOST_CONFIG_ROOT_DIR:-./config}
        target: /home/pokuser/soulmask/config
      - type: bind
        source: ${HOST_INSTANCE_DIR:-./instances/server_1}
        target: /home/pokuser/soulmask/instances/server_1
      - type: bind
        source: ${HOST_INSTANCE_DIR:-./instances/server_1}/saved
        target: /home/pokuser/soulmask/shared/server/WS/Saved

networks:
  soulmask_cluster:
    driver: bridge
    name: ${SOULMASK_CLUSTER_NETWORK_NAME:-soulmask-cluster}
    ipam:
      config:
        - subnet: ${SOULMASK_CLUSTER_SUBNET:-172.29.0.0/24}
