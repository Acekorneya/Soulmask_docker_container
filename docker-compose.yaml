services:
  soulmask:
    container_name: ${SOULMASK_CONTAINER_NAME:-soulmask}
    image: ${SOULMASK_IMAGE:-acekorneya/soul_server}:${SOULMASK_TAG:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: ${SOULMASK_RESTART_POLICY:-unless-stopped}
    environment:
      AUTO_UPDATE: ${AUTO_UPDATE:-true}
      HOME: /home/pokuser/soulmask/data/home
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SOULMASK_ADMIN_PASSWORD: ${SOULMASK_ADMIN_PASSWORD:-AdminChangeMePlease!}
      SOULMASK_APP_ID: 3017300
      SOULMASK_BACKUP_INTERVAL_MINUTES: ${SOULMASK_BACKUP_INTERVAL_MINUTES:-}
      SOULMASK_BACKUP_INTERVAL_SECONDS: ${SOULMASK_BACKUP_INTERVAL_SECONDS:-900}
      SOULMASK_CLUSTER_CLIENT_SERVER_CONNECT: ${SOULMASK_CLUSTER_CLIENT_SERVER_CONNECT:-}
      SOULMASK_CLUSTER_MAIN_SERVER_PORT: ${SOULMASK_CLUSTER_MAIN_SERVER_PORT:-}
      SOULMASK_COEF_TEMPLATE: ${SOULMASK_COEF_TEMPLATE:-}
      SOULMASK_CONFIG_DIR: /home/pokuser/soulmask/config
      SOULMASK_DATA_DIR: /home/pokuser/soulmask/data
      SOULMASK_ECHO_PORT: ${SOULMASK_ECHO_PORT:-18888}
      SOULMASK_EXTRA_ARGS: ${SOULMASK_EXTRA_ARGS:-}
      SOULMASK_GAME_MODE: ${SOULMASK_GAME_MODE:-pve}
      SOULMASK_GAME_PORT: ${SOULMASK_GAME_PORT:-8777}
      SOULMASK_INIT_BACKUP: ${SOULMASK_INIT_BACKUP:-false}
      SOULMASK_INSTALL_DIR: /home/pokuser/soulmask/data/server
      SOULMASK_LEVEL_NAME: ${SOULMASK_LEVEL_NAME:-Level01_Main}
      SOULMASK_LISTEN_ADDRESS: ${SOULMASK_LISTEN_ADDRESS:-0.0.0.0}
      SOULMASK_LOG_ENABLED: ${SOULMASK_LOG_ENABLED:-true}
      SOULMASK_MAX_PLAYERS: ${SOULMASK_MAX_PLAYERS:-50}
      SOULMASK_MOD_IDS: ${SOULMASK_MOD_IDS:-}
      SOULMASK_ONLINE_MODE: ${SOULMASK_ONLINE_MODE:-Steam}
      SOULMASK_PERMISSION_MASK: ${SOULMASK_PERMISSION_MASK:-}
      SOULMASK_QUERY_PORT: ${SOULMASK_QUERY_PORT:-27015}
      SOULMASK_RCON_ADDRESS: ${SOULMASK_RCON_ADDRESS:-}
      SOULMASK_RCON_PASSWORD: ${SOULMASK_RCON_PASSWORD:-}
      SOULMASK_RCON_PORT: ${SOULMASK_RCON_PORT:-19000}
      SOULMASK_SAVE_INTERVAL_SECONDS: ${SOULMASK_SAVE_INTERVAL_SECONDS:-600}
      SOULMASK_SERVER_ID: ${SOULMASK_SERVER_ID:-}
      SOULMASK_SERVER_NAME: ${SOULMASK_SERVER_NAME:-POK Soulmask Server}
      SOULMASK_SERVER_PASSWORD: ${SOULMASK_SERVER_PASSWORD:-}
      SOULMASK_STEAM_BETA_PASSWORD: ${SOULMASK_STEAM_BETA_PASSWORD:-}
      SOULMASK_STEAM_BRANCH: ${SOULMASK_STEAM_BRANCH:-}
      SOULMASK_STEAMCMD_DIR: /home/pokuser/soulmask/data/steamcmd
      SOULMASK_TRIBE_MAX_MEMBERS: ${SOULMASK_TRIBE_MAX_MEMBERS:-}
      TZ: ${TZ:-UTC}
      VALIDATE_ON_UPDATE: ${VALIDATE_ON_UPDATE:-false}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'WSServer-Linux|WSServer.sh' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    ports:
      - "${SOULMASK_PUBLISHED_GAME_PORT:-8777}:${SOULMASK_GAME_PORT:-8777}/udp"
      - "${SOULMASK_PUBLISHED_QUERY_PORT:-27015}:${SOULMASK_QUERY_PORT:-27015}/udp"
      - "${SOULMASK_PUBLISHED_RCON_PORT:-19000}:${SOULMASK_RCON_PORT:-19000}/tcp"
    stop_grace_period: 120s
    volumes:
      - type: bind
        source: ${HOST_DATA_DIR:-./data}
        target: /home/pokuser/soulmask/data
      - type: bind
        source: ${HOST_CONFIG_DIR:-./config}
        target: /home/pokuser/soulmask/config
